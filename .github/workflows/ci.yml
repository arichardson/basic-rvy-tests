# SPDX-License-Identifier: BSD-2-Clause

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  # CHERI-Alliance/qemu (CHERI 0.9.3, RVY 0.9.9, and RVY 0.9.10)
  QEMU_REPO: CHERI-Alliance/qemu
  QEMU_SHA: 937b306b8b1288d0dd16e04be85ffa29ceb0c6d3
  # CHERI-Alliance/sail-riscv (CHERI 0.9.3)
  SAIL_093_REPO: CHERI-Alliance/sail-riscv
  SAIL_093_SHA: 7726ab7586de0ef4a4a23e2d37fd4310fd43bedd
  # CHERI-Alliance/sail-riscv (RVY 0.9.9)
  SAIL_099_REPO: CHERI-Alliance/sail-riscv
  SAIL_099_SHA: d445eb71ded3d5e9c9bde0b00f81a6a4bb0a613b
  SAIL_COMPILER_VERSION: 0.20.3
  ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_summary=1
  UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_summary=1:print_stacktrace=1

jobs:
  build-qemu:
    name: Build QEMU
    runs-on: ubuntu-24.04
    steps:
      - name: Cache QEMU binaries
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qemu
          key: qemu-sanitizers-ubuntu-24.04-${{ env.QEMU_SHA }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang libclang-rt-dev libfdt-dev libglib2.0-dev libpixman-1-dev ninja-build pkgconf python-is-python3 python3-venv

      - name: Checkout QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.QEMU_REPO }}
          ref: ${{ env.QEMU_SHA }}
          path: qemu-src

      - name: Build QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git -C qemu-src rm --cached tests/rvy
          mkdir -p qemu-build "${{ runner.temp }}/qemu/bin" qemu-src/tests/rvy/src
          touch qemu-src/tests/rvy/src/meson.build
          cd qemu-build
          ../qemu-src/configure \
            --cc=clang \
            --cxx=clang++ \
            --enable-debug \
            --enable-sanitizers \
            --enable-werror \
            --without-default-features \
            --enable-system \
            --enable-tcg \
            --enable-fdt=system \
            --disable-docs \
            --disable-linux-user \
            --disable-tools \
            --rvy-test-cc=false \
            --target-list=riscv64y-softmmu,riscv32y-softmmu,riscv64cheristd-softmmu,riscv32cheristd-softmmu
          ninja qemu-system-riscv64y qemu-system-riscv32y \
            qemu-system-riscv64cheristd qemu-system-riscv32cheristd
          cp qemu-system-riscv64y qemu-system-riscv32y \
            qemu-system-riscv64cheristd qemu-system-riscv32cheristd \
            "${{ runner.temp }}/qemu/bin/"

  build-sail-093:
    name: Build Sail 0.9.3
    runs-on: ubuntu-24.04
    steps:
      - name: Cache Sail 0.9.3 binary
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sail-093
          key: sail-093-cfg-ubuntu-24.04-sail-${{ env.SAIL_COMPILER_VERSION }}-${{ env.SAIL_093_SHA }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake curl g++ libgmp-dev ninja-build pkgconf
          sudo mkdir -p /usr/local
          curl --fail --location \
            "https://github.com/rems-project/sail/releases/download/${SAIL_COMPILER_VERSION}-binary/sail-Linux-x86_64.tar.gz" \
            | sudo tar xvz --directory=/usr/local --strip-components=1

      - name: Checkout Sail 0.9.3
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SAIL_093_REPO }}
          ref: ${{ env.SAIL_093_SHA }}
          path: sail-src

      - name: Build Sail 0.9.3
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S sail-src -B sail-build -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja -C sail-build sail_riscv_sim
          strip sail-build/c_emulator/sail_riscv_sim
          mkdir -p "${{ runner.temp }}/sail-093/bin" "${{ runner.temp }}/sail-093/share/sail_riscv/config"
          cp sail-build/c_emulator/sail_riscv_sim "${{ runner.temp }}/sail-093/bin/"
          cp sail-src/config/*.json "${{ runner.temp }}/sail-093/share/sail_riscv/config/"

  build-sail-099:
    name: Build Sail 0.9.9
    runs-on: ubuntu-24.04
    steps:
      - name: Cache Sail 0.9.9 binary
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/sail-099
          key: sail-099-cfg-ubuntu-24.04-sail-${{ env.SAIL_COMPILER_VERSION }}-${{ env.SAIL_099_SHA }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            cmake curl g++ libgmp-dev ninja-build pkgconf
          sudo mkdir -p /usr/local
          curl --fail --location \
            "https://github.com/rems-project/sail/releases/download/${SAIL_COMPILER_VERSION}-binary/sail-Linux-x86_64.tar.gz" \
            | sudo tar xvz --directory=/usr/local --strip-components=1

      - name: Checkout Sail 0.9.9
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SAIL_099_REPO }}
          ref: ${{ env.SAIL_099_SHA }}
          path: sail-src

      - name: Build Sail 0.9.9
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S sail-src -B sail-build -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja -C sail-build sail_riscv_sim
          strip sail-build/c_emulator/sail_riscv_sim
          mkdir -p "${{ runner.temp }}/sail-099/bin" "${{ runner.temp }}/sail-099/share/sail_riscv/config"
          cp sail-build/c_emulator/sail_riscv_sim "${{ runner.temp }}/sail-099/bin/"
          cp sail-src/config/*.json "${{ runner.temp }}/sail-099/share/sail_riscv/config/"

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    needs: [build-qemu, build-sail-093, build-sail-099]
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Restore QEMU binaries
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/qemu
          key: qemu-sanitizers-ubuntu-24.04-${{ env.QEMU_SHA }}
          fail-on-cache-miss: true

      - name: Restore Sail 0.9.3 binary
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sail-093
          key: sail-093-cfg-ubuntu-24.04-sail-${{ env.SAIL_COMPILER_VERSION }}-${{ env.SAIL_093_SHA }}
          fail-on-cache-miss: true

      - name: Restore Sail 0.9.9 binary
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/sail-099
          key: sail-099-cfg-ubuntu-24.04-sail-${{ env.SAIL_COMPILER_VERSION }}-${{ env.SAIL_099_SHA }}
          fail-on-cache-miss: true

      - name: Install test dependencies
        run: |
          sudo sysctl -w kernel.core_pattern=core
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang libfdt1 libglib2.0-0t64 libgmp10 libpixman-1-0 lld ninja-build python3-pip
          python3 -m pip install --break-system-packages 'meson>=1.10.0'

      - name: Build test ELFs and run suite
        run: |
          meson setup build \
            -Dqemu="${{ runner.temp }}/qemu" \
            -Dsail_093="${{ runner.temp }}/sail-093" \
            -Dsail_099="${{ runner.temp }}/sail-099"
          ninja -C build
          meson test -C build --print-errorlogs || true

      - name: Upload testlog.json artifact
        if: always() && hashFiles('build/meson-logs/testlog.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: testlog
          path: build/meson-logs/testlog.json

      - name: Download baseline testlog.json from main
        if: always() && github.event_name == 'pull_request' && hashFiles('build/meson-logs/testlog.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          RUN_ID=""
          if [ -n "$BASE_SHA" ]; then
            RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
              --branch main --event push --commit "$BASE_SHA" --status completed \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          fi
          if [ -z "$RUN_ID" ] || ! gh run download "$RUN_ID" --repo "${{ github.repository }}" --name testlog --dir base-artifact 2>/dev/null; then
            for id in $(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
              --branch main --event push --status completed \
              --limit 10 --json databaseId --jq '.[].databaseId' || true); do
              if [ "$id" != "${{ github.run_id }}" ] && \
                 gh run download "$id" --repo "${{ github.repository }}" --name testlog --dir base-artifact 2>/dev/null; then
                break
              fi
            done
          fi

      - name: Summarize test results
        if: always() && hashFiles('build/meson-logs/testlog.json') != ''
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .github/summarize-test-results.py \
              --markdown test-summary.md \
              build/meson-logs/testlog.json \
              base-artifact/testlog.json
          else
            python3 .github/summarize-test-results.py \
              --markdown test-summary.md \
              build/meson-logs/testlog.json
          fi

      - name: Post test results comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('test-summary.md') != ''
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rvy-test-results -->';
            const body = fs.readFileSync('test-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
